<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حاسبة الإجازة</title>
<meta name="theme-color" content="#0b5394">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حاسبة الإجازة">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f0f4f8;--card:#fff;--ink:#1b2733;--muted:#5d6b7a;--brand:#0b5394;--on-brand:#fff;--line:#d0d9e6;--soft:#eef3fb;--leave:#fff;--rest:#e8f5e9;--off:#fff4d6;--danger:#fde8e8;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1720;--card:#18222e;--ink:#e6edf5;--muted:#9fb0c1;--brand:#6fb1ee;--on-brand:#06223b;--line:#2c3b4c;--soft:#223245;--leave:#18222e;--rest:#17331f;--off:#3a3216;--danger:#3d2224;--err:#ff8a80}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1720;--card:#18222e;--ink:#e6edf5;--muted:#9fb0c1;--brand:#6fb1ee;--on-brand:#06223b;--line:#2c3b4c;--soft:#223245;--leave:#18222e;--rest:#17331f;--off:#3a3216;--danger:#3d2224;--err:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;padding:12px;max-width:640px;margin-inline:auto;background:var(--bg);color:var(--ink);font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;line-height:1.5}
h1{text-align:center;color:var(--brand);font-size:22px;margin:8px 0 14px}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
label{display:block;font-weight:700;margin:12px 0 6px;font-size:15px}
.card>label:first-child{margin-top:0}
input,select,button{font-family:inherit}
input[type=date],input[type=number],input[type=text],select{width:100%;min-height:48px;padding:10px 12px;font-size:17px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.check{display:flex;align-items:center;gap:10px;font-weight:500;margin:12px 0 0;cursor:pointer}
.check input{width:22px;height:22px;margin:0;accent-color:var(--brand)}
.btn{min-height:46px;padding:10px 14px;border-radius:12px;border:1px solid transparent;font-weight:700;font-size:16px;cursor:pointer}
.btn-p{background:var(--brand);color:var(--on-brand)}
.btn-s{background:var(--soft);color:var(--brand);border-color:var(--line)}
.btn:active{transform:scale(.98)}
.stepper{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.stepper input{text-align:center;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.hrow{display:grid;grid-template-columns:1.1fr 1fr 48px;gap:6px;margin:6px 0}
.hrow input{font-size:15px;min-height:46px;padding:8px}
.hrow .del{background:var(--danger);color:var(--err);padding:0}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.sum>div{background:var(--card);border-radius:14px;padding:12px;text-align:center;box-shadow:0 1px 6px rgba(0,0,0,.06);border-top:4px solid var(--brand)}
.sum small{color:var(--muted)}
.sum h3{margin:4px 0;color:var(--brand);font-size:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips span{background:var(--card);padding:6px 12px;border-radius:20px;font-size:14px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--brand);color:var(--on-brand);padding:8px}
td{padding:7px;border-bottom:1px solid var(--line);text-align:center}
tr.leave{background:var(--leave)}tr.rest{background:var(--rest)}tr.off{background:var(--off)}
tr.last td{font-weight:700;border-bottom:2px solid var(--brand)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 2px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid var(--line);margin-inline-end:5px;vertical-align:-1px}
#err{color:var(--err);font-weight:700;text-align:center;min-height:0}
#err:not(:empty){background:var(--danger);padding:12px;border-radius:12px;margin-bottom:12px}
#toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
#toast.on{opacity:1}
.note{font-size:13px;color:var(--muted);margin:8px 2px 0}
@media print{
 body{background:#fff;color:#000;padding:0;max-width:none}
 .noprint,#toast,.actions{display:none!important}
 .card,.sum>div{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
 thead{display:table-header-group}tr{break-inside:avoid}
}
</style>
</head>
<body>
<h1>حاسبة الإجازة</h1>

<div class="card noprint">
 <label for="startDate">📅 بداية الإجازة</label>
 <div class="stepper">
  <button class="btn btn-s" type="button" id="dm" aria-label="يوم سابق">− يوم</button>
  <input type="date" id="startDate" value="2027-02-28">
  <button class="btn btn-s" type="button" id="dp" aria-label="يوم لاحق">+ يوم</button>
 </div>
 <div class="grid2" style="margin-top:12px">
  <div>
   <label for="balance" style="margin-top:0">رصيد الإجازة (أيام)</label>
   <div class="stepper">
    <button class="btn btn-s" type="button" id="bm" aria-label="إنقاص الرصيد">−</button>
    <input type="number" id="balance" inputmode="numeric" min="1" max="365" value="53">
    <button class="btn btn-s" type="button" id="bp" aria-label="زيادة الرصيد">+</button>
   </div>
  </div>
  <div>
   <label for="satMode" style="margin-top:0">يوم السبت</label>
   <select id="satMode"><option value="rest">راحة</option><option value="work">عمل (يُحسب من الرصيد)</option></select>
  </div>
 </div>
 <label class="check"><input type="checkbox" id="fri" checked> الجمعة عطلة أسبوعية</label>
 <label class="check"><input type="checkbox" id="eid4"> عيد الأضحى 4 أيام (إضافة 19 مايو 2027)</label>
</div>

<div class="card noprint">
 <label>🗓️ العطل الرسمية (لا تُحسب من الرصيد)</label>
 <div id="holList"></div>
 <div class="actions">
  <button class="btn btn-s" type="button" id="addHol">+ إضافة عطلة</button>
  <button class="btn btn-s" type="button" id="resetHol">↺ العطل الافتراضية</button>
 </div>
 <p class="note">التواريخ الافتراضية تقديرية (2027) وتتغير بحسب رؤية الهلال، عدّلها حسب التقويم الرسمي المعتمد.</p>
</div>

<div id="err" role="alert"></div>

<div id="results">
 <div class="sum" id="summary"></div>
 <div class="chips" id="breakdown"></div>
 <div class="card" style="padding:8px">
  <div class="tw">
   <table>
    <thead><tr><th>م</th><th>التاريخ</th><th>اليوم</th><th>النوع</th><th>محسوب</th><th>متبقي</th></tr></thead>
    <tbody id="tbody"></tbody>
   </table>
  </div>
  <div class="legend"><span><i style="background:var(--leave)"></i>إجازة محسوبة</span><span><i style="background:var(--rest)"></i>راحة أسبوعية</span><span><i style="background:var(--off)"></i>عطلة رسمية</span></div>
  <div class="actions">
   <button class="btn btn-p" type="button" id="pdf">📄 حفظ PDF</button>
   <button class="btn btn-p" type="button" id="csv">📥 تصدير Excel</button>
   <button class="btn btn-s" type="button" id="share">📤 مشاركة النتيجة</button>
   <button class="btn btn-s" type="button" id="print">🖨️ طباعة</button>
  </div>
 </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const DEF=[['2027-03-09','عيد الفطر'],['2027-03-10','عيد الفطر'],['2027-03-11','عيد الفطر'],['2027-05-15','وقفة عرفة'],['2027-05-16','عيد الأضحى'],['2027-05-17','عيد الأضحى'],['2027-05-18','عيد الأضحى']];
const EID4='2027-05-19', KEY='leave-calc-v2';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const parse=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(Date.UTC(+m[1],+m[2]-1,+m[3])):null};
const iso=d=>d.toISOString().slice(0,10);
const fmt=s=>s.split('-').reverse().join('/');
const addDays=(d,n)=>new Date(d.getTime()+n*864e5);
const defHols=()=>DEF.map(([d,n])=>({d,n}));
let hols=defHols(), recs=[], info=null;

function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}

function save(){try{localStorage.setItem(KEY,JSON.stringify({s:$('startDate').value,b:$('balance').value,sat:$('satMode').value,fri:$('fri').checked,h:hols}))}catch(e){}}
function load(){try{
 const o=JSON.parse(localStorage.getItem(KEY)||'null'); if(!o)return;
 if(parse(o.s))$('startDate').value=o.s;
 if(o.b!==undefined)$('balance').value=o.b;
 if(o.sat==='rest'||o.sat==='work')$('satMode').value=o.sat;
 $('fri').checked=o.fri!==false;
 if(Array.isArray(o.h))hols=o.h.filter(h=>h&&typeof h.d==='string'&&typeof h.n==='string');
}catch(e){}}

function renderHols(sort){
 if(sort)hols.sort((a,b)=>a.d.localeCompare(b.d));
 $('holList').innerHTML=hols.map((h,i)=>`<div class="hrow"><input type="date" value="${esc(h.d)}" data-i="${i}" data-k="d" aria-label="تاريخ العطلة"><input type="text" value="${esc(h.n)}" data-i="${i}" data-k="n" aria-label="اسم العطلة" maxlength="40"><button class="btn del" type="button" data-del="${i}" aria-label="حذف العطلة">✕</button></div>`).join('')||'<p class="note">لا توجد عطل مضافة.</p>';
 $('eid4').checked=hols.some(h=>h.d===EID4);
}

function calc(){
 save();
 const start=parse($('startDate').value), bal=parseInt($('balance').value,10);
 const sat=$('satMode').value, fri=$('fri').checked;
 const err=!start?'اختر تاريخ بداية صحيحًا.':(!(bal>=1&&bal<=365)?'أدخل رصيدًا بين 1 و365 يومًا.':'');
 $('err').textContent=err; $('results').hidden=!!err;
 if(err){recs=[];info=null;return}
 const map={}; hols.forEach(h=>{if(parse(h.d)&&!map[h.d])map[h.d]=h.n.trim()||'عطلة'});
 const isRest=d=>{const w=d.getUTCDay();return (w===5&&fri)||(w===6&&sat==='rest')};
 const cnt={l:0,f:0,s:0,o:0}; recs=[];
 let cur=start, rem=bal, i=0;
 while(rem>0&&i<2000){
  const k=iso(cur), w=cur.getUTCDay(); let type,cls,counted=false;
  if(map[k]!==undefined){type='رسمية - '+map[k];cls='off';cnt.o++}
  else if(w===5&&fri){type='جمعة';cls='rest';cnt.f++}
  else if(w===6&&sat==='rest'){type='سبت';cls='rest';cnt.s++}
  else{type='إجازة';cls='leave';counted=true;rem--;cnt.l++}
  recs.push({idx:++i,iso:k,wd:WD[w],type,cls,counted,rem});
  cur=addDays(cur,1);
 }
 const last=recs[recs.length-1], first=recs[0];
 let nw=addDays(parse(last.iso),1);
 while(map[iso(nw)]!==undefined||isRest(nw))nw=addDays(nw,1);
 const total=recs.length, other=total-bal;
 info={first:first.iso,last:last.iso,back:iso(nw),backWd:WD[nw.getUTCDay()]};
 $('summary').innerHTML=
  `<div><small>أول يوم إجازة</small><h3>${fmt(first.iso)}</h3><small>${first.wd}</small></div>
   <div><small>آخر يوم إجازة</small><h3>${fmt(last.iso)}</h3><small>${last.wd}</small></div>
   <div><small>أول دوام</small><h3>${fmt(info.back)}</h3><small>${info.backWd}</small></div>
   <div><small>المدة الإجمالية</small><h3>${total} يوم</h3><small>${bal} من الرصيد + ${other} عطلة وراحة</small></div>`;
 $('breakdown').innerHTML=`<span>إجازة ${cnt.l}</span><span>جمعة ${cnt.f}</span><span>سبت ${cnt.s}</span><span>رسمية ${cnt.o}</span>`;
 $('tbody').innerHTML=recs.map((r,n)=>`<tr class="${r.cls}${n===recs.length-1?' last':''}"><td>${r.idx}</td><td>${fmt(r.iso)}</td><td>${r.wd}</td><td>${esc(r.type)}</td><td>${r.counted?'نعم':'لا'}</td><td>${r.rem}</td></tr>`).join('');
}

function shiftDate(n){const d=parse($('startDate').value)||parse('2027-02-28');$('startDate').value=iso(addDays(d,n));calc()}
function shiftBal(n){const v=parseInt($('balance').value,10)||0;$('balance').value=Math.min(365,Math.max(1,v+n));calc()}

$('dm').onclick=()=>shiftDate(-1); $('dp').onclick=()=>shiftDate(1);
$('bm').onclick=()=>shiftBal(-1); $('bp').onclick=()=>shiftBal(1);
['startDate','balance','satMode','fri'].forEach(id=>{$(id).addEventListener(id==='balance'?'input':'change',calc)});
$('eid4').addEventListener('change',e=>{
 hols=hols.filter(h=>h.d!==EID4);
 if(e.target.checked)hols.push({d:EID4,n:'عيد الأضحى'});
 renderHols(true);calc();
});
$('holList').addEventListener('change',e=>{const t=e.target;if(t.dataset.k&&hols[t.dataset.i]){hols[t.dataset.i][t.dataset.k]=t.value;if(t.dataset.k==='d')renderHols(true);calc()}});
$('holList').addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(b){hols.splice(+b.dataset.del,1);renderHols();calc()}});
$('addHol').onclick=()=>{hols.push({d:$('startDate').value||iso(new Date()),n:'عطلة'});renderHols();calc();const r=$('holList').querySelectorAll('.hrow');r[r.length-1]?.scrollIntoView({block:'center'})};
$('resetHol').onclick=()=>{hols=defHols();renderHols();calc();toast('تمت استعادة العطل الافتراضية')};

$('csv').onclick=()=>{
 if(!recs.length)return;
 const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const rows=['م,التاريخ,اليوم,النوع,محسوب,متبقي',...recs.map(r=>[r.idx,r.iso,r.wd,q(r.type),r.counted?'نعم':'لا',r.rem].join(','))];
 const u=URL.createObjectURL(new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv;charset=utf-8'}));
 const a=document.createElement('a');a.href=u;a.download='leave.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);
};
$('share').onclick=async()=>{
 if(!info)return;
 const text=`إجازتي من ${fmt(info.first)} إلى ${fmt(info.last)}، وأول دوام يوم ${info.backWd} ${fmt(info.back)}.`;
 try{
  if(navigator.share){await navigator.share({title:'حساب الإجازة',text});return}
  await navigator.clipboard.writeText(text);toast('تم نسخ النتيجة');
 }catch(e){if(e&&e.name!=='AbortError')toast('تعذّرت المشاركة، انسخ النتيجة يدويًا')}
};
$('print').onclick=()=>window.print();
$('pdf').onclick=()=>{toast('في نافذة الطباعة اختر «حفظ كـ PDF»');setTimeout(()=>window.print(),700)};

load(); renderHols(true); calc();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
 window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
